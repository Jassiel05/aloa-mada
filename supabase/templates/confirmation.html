<!doctype html>
<html lang="fr">
<body style="margin:0;background:#F6F7FB;font-family:Arial,Helvetica,sans-serif;color:#17162B">
<div style="max-width:520px;margin:0 auto;padding:32px 24px">
  <div style="background:#ffffff;border:1px solid #E4E6EF;border-radius:16px;padding:28px">
    <h1 style="font-size:22px;line-height:1.25;margin:0 0 16px;color:#17133F">Confirmez votre email</h1>
    <p style="font-size:15px;line-height:1.6;margin:0 0 8px">Bienvenue sur Aloa-Mada !</p>
    <p style="font-size:15px;line-height:1.6;margin:0">Un clic suffit pour activer votre compte :</p>
    <p style="margin:28px 0 0">
      <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email" style="display:inline-block;background:#0277C2;color:#ffffff;text-decoration:none;font-weight:700;padding:14px 24px;border-radius:12px">Confirmer mon email</a>
    </p>
    <p style="font-size:13px;line-height:1.6;color:#5D6075;margin:24px 0 0">Ce lien est valable une seule fois. Si vous n'êtes pas à l'origine de cette inscription, ignorez simplement cet email.</p>
  </div>
</div>
</body>
</html>
